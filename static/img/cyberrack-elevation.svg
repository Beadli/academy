<text x="1030" y="323" class="body">~125 W idle</text>
<text x="1030" y="369" class="body">9U occupied, 1U spare</text>
<text x="1030" y="415" class="body">carryable: no UPS, no lead-acid</text>
<text x="1030" y="455" class="small">External surge protection or an off-rack UPS may be added separately.</text>

<rect x="995" y="520" width="610" height="170" rx="12" class="panel"/>
<text x="1030" y="565" class="label">PHYSICAL DESIGN RULE</text>
<text x="1030" y="605" class="body">Only equipment designed for, or adapted to, 10-inch rails appears here.</text>
<text x="1030" y="640" class="body">No battery equipment is placed inside the rack.</text>
<text x="1030" y="675" class="body">Every active component remains independently replaceable.</text>

