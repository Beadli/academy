<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- server rack -->
  <rect x="55" y="22" width="90" height="102" rx="8"/>
  <line x1="55" y1="56" x2="145" y2="56"/>
  <line x1="55" y1="90" x2="145" y2="90"/>
  <!-- vent lines per bay -->
  <line x1="96" y1="39" x2="130" y2="39"/>
  <line x1="96" y1="73" x2="130" y2="73"/>
  <line x1="96" y1="107" x2="130" y2="107"/>
