<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1024" viewBox="0 0 1800 1024" role="img" aria-label="CyberRack service stack: three matched mini PCs named Atlas, Hermes and Daedalus each running Proxmox VE, a storage appliance running TrueNAS SCALE, and a mini PC running OPNsense, shown as three layers: the hardware each sits on, the platform that runs on the hardware, and the services a user actually logs into.">
