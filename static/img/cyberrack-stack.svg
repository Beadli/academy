<text x="1597.0" y="800" class="small" text-anchor="middle">dual-port</text>
<rect x="90" y="866" width="1668" height="96" rx="10" class="card"/>
<text x="114" y="902" class="label">The three green nodes are one cluster, not three servers.</text>
<text x="114" y="930" class="small">Those role names are preferences, not homes. Any workload on Atlas, Hermes or Daedalus can move to either of the others while it is still running, which is the entire reason for buying three matching machines.</text>
<text x="1758" y="1000" class="foot" text-anchor="end">designed, not yet built</text>
</svg>