<rect x="0" y="0" width="1800" height="1024" rx="0" class="bg"/>
<text x="90" y="74" class="title">CyberRack v1.1 · what runs where</text>
<text x="90" y="112" class="sub">the same rack read as three layers: hardware, the platform on it, and the services you actually log into</text>
