name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Unset during the review phase, so the site builds for
          # beadli.github.io/academy/. Set to 1 at launch.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      # GitHub Pages reads a CNAME file in the site root and serves on that
      # domain. Written only at launch, so the review deployment stays on
      # beadli.github.io where it belongs.
      - name: Add CNAME at launch only
        if: vars.CUSTOM_DOMAIN == '1'
        run: cp CNAME.launch build/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
